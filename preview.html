<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PresentaWeb Preview</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui"],
            },
            boxShadow: {
              soft: "0 20px 60px -30px rgba(15, 23, 42, 0.35)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="font-sans bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
      const { useEffect, useMemo, useState } = React;
      const html = htm.bind(React.createElement);

      const createIcon = (paths) => ({ size = 20, className = "" }) =>
        React.createElement(
          "svg",
          {
            width: size,
            height: size,
            viewBox: "0 0 24 24",
            fill: "none",
            stroke: "currentColor",
            strokeWidth: "2",
            strokeLinecap: "round",
            strokeLinejoin: "round",
            className,
            "aria-hidden": true,
          },
          ...paths.map((path, index) => React.createElement("path", { key: index, d: path }))
        );

      const Plus = createIcon(["M12 5v14", "M5 12h14"]);
      const Presentation = createIcon([
        "M2 3h20",
        "M5 3v11a4 4 0 0 0 4 4h6a4 4 0 0 0 4-4V3",
        "M8 21l4-4 4 4",
      ]);
      const Trash2 = createIcon(["M3 6h18", "M8 6V4h8v2", "M6 6l1 14h10l1-14"]);
      const ChevronLeft = createIcon(["M15 18l-6-6 6-6"]);
      const ChevronRight = createIcon(["M9 18l6-6-6-6"]);
      const Globe = createIcon([
        "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z",
        "M3 12h18",
        "M12 3a12 12 0 0 1 0 18",
        "M12 3a12 12 0 0 0 0 18",
      ]);
      const LogOut = createIcon(["M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4", "M16 17l5-5-5-5", "M21 12H9"]);
      const ArrowLeft = createIcon(["M19 12H5", "M12 19l-7-7 7-7"]);
      const ArrowRight = createIcon(["M5 12h14", "M12 5l7 7-7 7"]);
      const ExternalLink = createIcon(["M15 3h6v6", "M10 14L21 3", "M21 14v7H3V3h7"]);
      const RefreshCcw = createIcon(["M3 12a9 9 0 0 1 15-6", "M21 3v6h-6", "M21 12a9 9 0 0 1-15 6", "M3 21v-6h6"]);
      const X = createIcon(["M18 6L6 18", "M6 6l12 12"]);

      const layoutOptions = [
        { value: "title", label: "Solo Título", description: "Gran titular con subtítulo" },
        { value: "centered", label: "Texto Centrado", description: "Título + cuerpo centrado" },
        { value: "image-left", label: "Imagen Izquierda + Texto", description: "Imagen lateral izquierda" },
        { value: "image-right", label: "Imagen Derecha + Texto", description: "Imagen lateral derecha" },
      ];

      const starterSlides = [
        {
          id: "slide-1",
          title: "Bienvenidos a PresentaWeb",
          content: "Crea presentaciones claras, modernas y listas para compartir.",
          imageUrl:
            "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80",
          layout: "image-right",
          speakerNotes: "Abrir con energía y explicar el objetivo de la herramienta.",
        },
        {
          id: "slide-2",
          title: "Mensaje central",
          content: "Diseña tu narrativa con un enfoque visual y tipografía elegante.",
          imageUrl:
            "https://images.unsplash.com/photo-1487611459768-bd414656ea10?auto=format&fit=crop&w=800&q=80",
          layout: "image-left",
          speakerNotes: "Destacar que se puede editar todo en tiempo real.",
        },
        {
          id: "slide-3",
          title: "Siguiente paso",
          content: "Activa el modo presentador y comparte tu historia.",
          layout: "centered",
          speakerNotes: "Invitar a usar el botón Presentar.",
        },
      ];

      const createEmptySlide = (index) => ({
        id: `slide-${Date.now()}-${index}`,
        title: "Nueva diapositiva",
        content: "Escribe aquí el contenido principal.",
        imageUrl: "",
        layout: "title",
        speakerNotes: "",
      });

      const WebBrowser = ({ onClose }) => {
        const defaultUrl = "https://developer.mozilla.org";
        const [inputUrl, setInputUrl] = useState(defaultUrl);
        const [history, setHistory] = useState([defaultUrl]);
        const [historyIndex, setHistoryIndex] = useState(0);
        const [reloadKey, setReloadKey] = useState(0);

        const currentUrl = history[historyIndex];
        const canGoBack = historyIndex > 0;
        const canGoForward = historyIndex < history.length - 1;

        const safeUrl = useMemo(() => {
          try {
            const parsed = new URL(currentUrl);
            return parsed.toString();
          } catch {
            return "about:blank";
          }
        }, [currentUrl]);

        useEffect(() => {
          setInputUrl(currentUrl);
        }, [currentUrl]);

        const handleNavigate = (event) => {
          event?.preventDefault();
          if (!inputUrl.trim()) {
            return;
          }
          const formattedUrl = inputUrl.startsWith("http") ? inputUrl : `https://${inputUrl}`;
          setHistory((prev) => {
            const next = prev.slice(0, historyIndex + 1);
            next.push(formattedUrl);
            return next;
          });
          setHistoryIndex((prev) => prev + 1);
        };

        const openExternal = () => {
          const formattedUrl = inputUrl.startsWith("http") ? inputUrl : `https://${inputUrl}`;
          window.open(formattedUrl, "_blank", "noopener,noreferrer");
        };

        return html`
          <div className="w-full max-w-4xl overflow-hidden rounded-3xl border border-slate-800 bg-slate-950/95 shadow-soft">
            <div className="flex items-center justify-between border-b border-slate-800/80 bg-slate-950/90 px-4 py-3">
              <div className="flex items-center gap-2">
                <button
                  onClick=${() => canGoBack && setHistoryIndex((prev) => prev - 1)}
                  className="rounded-full border border-slate-800 bg-slate-900/70 p-2 text-slate-300 transition hover:border-indigo-400 hover:text-white disabled:cursor-not-allowed disabled:opacity-40"
                  disabled=${!canGoBack}
                >
                  <${ArrowLeft} size=${16} />
                </button>
                <button
                  onClick=${() => canGoForward && setHistoryIndex((prev) => prev + 1)}
                  className="rounded-full border border-slate-800 bg-slate-900/70 p-2 text-slate-300 transition hover:border-indigo-400 hover:text-white disabled:cursor-not-allowed disabled:opacity-40"
                  disabled=${!canGoForward}
                >
                  <${ArrowRight} size=${16} />
                </button>
                <button
                  onClick=${() => setReloadKey((prev) => prev + 1)}
                  className="rounded-full border border-slate-800 bg-slate-900/70 p-2 text-slate-300 transition hover:border-indigo-400 hover:text-white"
                >
                  <${RefreshCcw} size=${16} />
                </button>
              </div>
              <button
                onClick=${onClose}
                className="rounded-full border border-slate-800 bg-slate-900/70 p-2 text-slate-300 transition hover:border-rose-400 hover:text-white"
              >
                <${X} size=${16} />
              </button>
            </div>

            <div className="border-b border-slate-800/80 bg-slate-950/80 px-4 py-3">
              <form onSubmit=${handleNavigate} className="flex flex-wrap items-center gap-3">
                <input
                  value=${inputUrl}
                  onInput=${(event) => setInputUrl(event.target.value)}
                  className="min-w-0 flex-1 rounded-full border border-slate-800 bg-slate-900/60 px-4 py-2 text-sm text-slate-100 focus:border-indigo-400 focus:outline-none"
                  placeholder="Introduce una URL"
                />
                <button
                  type="submit"
                  className="rounded-full bg-indigo-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-400"
                >
                  Ir
                </button>
                <button
                  type="button"
                  onClick=${openExternal}
                  className="inline-flex items-center gap-2 rounded-full border border-indigo-400/50 bg-indigo-500/10 px-4 py-2 text-sm font-semibold text-indigo-100 transition hover:bg-indigo-500/20"
                >
                  <${ExternalLink} size=${14} />
                  Abrir Fuera
                </button>
              </form>
            </div>

            <div className="border-b border-yellow-500/40 bg-yellow-500/10 px-4 py-2 text-xs text-yellow-100">
              Algunos sitios como Google o YouTube bloquean iframes por seguridad. Usa “Abrir Fuera” si ves
              una pantalla en blanco.
            </div>

            <div className="h-[60vh] bg-slate-950">
              <iframe
                key=${reloadKey}
                title="Navegador integrado"
                src=${safeUrl}
                className="h-full w-full border-none"
                sandbox="allow-forms allow-same-origin allow-scripts allow-popups allow-modals"
              ></iframe>
            </div>
          </div>
        `;
      };

      const Presenter = ({ slides, activeSlide, activeSlideIndex, onNavigate, onExit, onSelectSlide }) => {
        const [controlsVisible, setControlsVisible] = useState(true);
        const [showBrowser, setShowBrowser] = useState(false);

        useEffect(() => {
          const handleKey = (event) => {
            if (event.key === "ArrowRight") {
              onNavigate("next");
            }
            if (event.key === "ArrowLeft") {
              onNavigate("prev");
            }
            if (event.key === "Escape") {
              onExit();
            }
          };
          window.addEventListener("keydown", handleKey);
          return () => window.removeEventListener("keydown", handleKey);
        }, [onNavigate, onExit]);

        useEffect(() => {
          let timeout;
          const handleMove = () => {
            setControlsVisible(true);
            if (timeout) {
              window.clearTimeout(timeout);
            }
            timeout = window.setTimeout(() => setControlsVisible(false), 2500);
          };
          window.addEventListener("mousemove", handleMove);
          handleMove();
          return () => {
            window.removeEventListener("mousemove", handleMove);
            if (timeout) {
              window.clearTimeout(timeout);
            }
          };
        }, []);

        const slideNumber = useMemo(() => activeSlideIndex + 1, [activeSlideIndex]);

        const renderSlideContent = () => {
          const hasImage = Boolean(activeSlide.imageUrl);

          switch (activeSlide.layout) {
            case "title":
              return html`
                <div className="flex h-full flex-col items-center justify-center text-center">
                  <h1 className="text-5xl font-semibold text-white md:text-6xl">${activeSlide.title}</h1>
                  <p className="mt-6 max-w-2xl text-lg text-slate-300 md:text-xl">${activeSlide.content}</p>
                </div>
              `;
            case "centered":
              return html`
                <div className="flex h-full flex-col items-center justify-center text-center">
                  <h2 className="text-4xl font-semibold text-white md:text-5xl">${activeSlide.title}</h2>
                  <p className="mt-6 max-w-3xl text-lg text-slate-300 md:text-xl">${activeSlide.content}</p>
                </div>
              `;
            case "image-left":
            case "image-right":
              return html`
                <div
                  className=${`flex h-full flex-col gap-10 md:flex-row ${
                    activeSlide.layout === "image-right" ? "md:flex-row-reverse" : ""
                  }`}
                >
                  <div className="flex flex-1 items-center justify-center">
                    ${hasImage
                      ? html`
                          <img
                            src=${activeSlide.imageUrl}
                            alt="Imagen de la diapositiva"
                            className="h-80 w-full rounded-3xl object-cover shadow-soft"
                          />
                        `
                      : html`
                          <div
                            className="flex h-80 w-full items-center justify-center rounded-3xl border border-dashed border-slate-700 bg-slate-900/40 text-slate-500"
                          >
                            Imagen opcional
                          </div>
                        `}
                  </div>
                  <div className="flex flex-1 flex-col justify-center">
                    <h2 className="text-4xl font-semibold text-white md:text-5xl">${activeSlide.title}</h2>
                    <p className="mt-6 text-lg text-slate-300 md:text-xl">${activeSlide.content}</p>
                  </div>
                </div>
              `;
            default:
              return null;
          }
        };

        return html`
          <div className="relative flex min-h-screen items-center justify-center overflow-hidden bg-black">
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(99,102,241,0.18),transparent_55%)]"></div>

            <div className="relative z-10 w-full max-w-6xl px-6 py-16">
              <div className="min-h-[70vh] rounded-[2.5rem] border border-slate-800/70 bg-slate-950/90 p-12 shadow-soft">
                ${renderSlideContent()}
              </div>
            </div>

            ${showBrowser
              ? html`
                  <div className="absolute inset-0 z-40 flex items-center justify-center bg-black/40 p-6">
                    <${WebBrowser} onClose=${() => setShowBrowser(false)} />
                  </div>
                `
              : null}

            <div
              className=${`fixed bottom-8 left-1/2 z-[100] flex -translate-x-1/2 items-center gap-4 rounded-full border border-slate-800/80 bg-slate-950/80 px-6 py-3 shadow-soft backdrop-blur transition-opacity ${
                controlsVisible ? "opacity-100" : "opacity-0"
              }`}
            >
              <button
                onClick=${() => onNavigate("prev")}
                className="rounded-full border border-slate-700/70 bg-slate-900/80 p-2 text-slate-200 transition hover:border-indigo-400 hover:text-white"
              >
                <${ChevronLeft} />
              </button>
              <span className="text-sm text-slate-300">${slideNumber} / ${slides.length}</span>
              <button
                onClick=${() => onNavigate("next")}
                className="rounded-full border border-slate-700/70 bg-slate-900/80 p-2 text-slate-200 transition hover:border-indigo-400 hover:text-white"
              >
                <${ChevronRight} />
              </button>
              <div className="h-8 w-px bg-slate-800"></div>
              <button
                onClick=${() => setShowBrowser((prev) => !prev)}
                className=${`inline-flex items-center gap-2 rounded-full border px-4 py-2 text-sm font-semibold transition ${
                  showBrowser
                    ? "border-indigo-400/80 bg-indigo-500/20 text-indigo-100"
                    : "border-slate-700/70 bg-slate-900/80 text-slate-200 hover:border-indigo-400"
                }`}
              >
                <${Globe} size=${16} />
                Navegador
              </button>
              <button
                onClick=${onExit}
                className="inline-flex items-center gap-2 rounded-full border border-rose-400/50 bg-rose-500/10 px-4 py-2 text-sm font-semibold text-rose-100 transition hover:bg-rose-500/20"
              >
                <${LogOut} size=${16} />
                Salir
              </button>
            </div>

            <div className="absolute right-6 top-6 z-10 rounded-full bg-slate-900/80 px-4 py-2 text-xs text-slate-300">
              ${activeSlide.title}
            </div>

            <div className="absolute left-6 top-6 z-10 flex gap-2">
              ${slides.map(
                (slide) => html`
                  <button
                    key=${slide.id}
                    onClick=${() => onSelectSlide(slide.id)}
                    className=${`h-2 w-6 rounded-full transition ${
                      slide.id === activeSlide.id ? "bg-indigo-400" : "bg-slate-700 hover:bg-slate-500"
                    }`}
                    aria-label=${`Ir a ${slide.title}`}
                  ></button>
                `
              )}
            </div>
          </div>
        `;
      };

      const Editor = ({
        slides,
        activeSlide,
        activeSlideIndex,
        onAddSlide,
        onDeleteSlide,
        onSelectSlide,
        onUpdateSlide,
        onPresent,
      }) => {
        const layoutPreviewClasses = {
          title: "items-center justify-center",
          centered: "items-center justify-center",
          "image-left": "items-center justify-start",
          "image-right": "items-center justify-end",
        };

        return html`
          <div className="flex min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
            <aside className="flex w-72 flex-col border-r border-slate-800/70 bg-slate-950/80 p-6 backdrop-blur">
              <div className="mb-6 flex items-center justify-between">
                <h2 className="text-sm font-semibold uppercase tracking-[0.2em] text-indigo-200/80">Diapositivas</h2>
                <button
                  onClick=${onAddSlide}
                  className="inline-flex items-center gap-1 rounded-full bg-indigo-500 px-3 py-1 text-xs font-semibold text-white shadow-lg shadow-indigo-500/30 transition hover:bg-indigo-400"
                >
                  <${Plus} size=${14} />
                  Nueva
                </button>
              </div>
              <div className="flex flex-1 flex-col gap-3 overflow-y-auto pr-1">
                ${slides.map((slide, index) => {
                  const isActive = slide.id === activeSlide.id;
                  return html`
                    <button
                      key=${slide.id}
                      onClick=${() => onSelectSlide(slide.id)}
                      className=${`group rounded-2xl border px-4 py-3 text-left transition ${
                        isActive
                          ? "border-indigo-400/80 bg-indigo-500/10 shadow-lg shadow-indigo-500/20"
                          : "border-slate-800/70 bg-slate-900/60 hover:border-indigo-500/40 hover:bg-slate-900"
                      }`}
                    >
                      <div className="flex items-center justify-between text-xs text-slate-400">
                        <span>#${index + 1}</span>
                        ${slides.length > 1
                          ? html`<span className="opacity-0 transition group-hover:opacity-100">Seleccionar</span>`
                          : null}
                      </div>
                      <div className="mt-2 text-sm font-semibold text-slate-100">${slide.title}</div>
                      <p className="mt-1 max-h-8 overflow-hidden text-xs text-slate-400">${slide.content}</p>
                    </button>
                  `;
                })}
              </div>
              <button
                onClick=${() => onDeleteSlide(activeSlide.id)}
                className="mt-6 inline-flex items-center justify-center gap-2 rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-2 text-sm font-semibold text-rose-200 transition hover:bg-rose-500/20"
              >
                <${Trash2} size=${16} />
                Eliminar diapositiva
              </button>
            </aside>

            <main className="flex flex-1 flex-col">
              <header className="flex items-center justify-between border-b border-slate-800/80 px-10 py-6">
                <div>
                  <h1 className="text-2xl font-semibold text-white">PresentaWeb</h1>
                  <p className="text-sm text-slate-400">Editor de presentaciones con estilo profesional.</p>
                </div>
                <button
                  onClick=${onPresent}
                  className="inline-flex items-center gap-2 rounded-full bg-indigo-500 px-6 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-indigo-400"
                >
                  <${Presentation} size=${18} />
                  Presentar
                </button>
              </header>

              <div className="grid flex-1 gap-8 px-10 py-8 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)]">
                <section className="flex flex-col gap-6">
                  <div className="rounded-3xl border border-slate-800/70 bg-slate-950/60 p-6 shadow-soft">
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="text-xs uppercase tracking-[0.2em] text-slate-400">Vista previa</p>
                        <h2 className="text-lg font-semibold text-slate-100">Diapositiva ${activeSlideIndex + 1}</h2>
                      </div>
                      <span className="rounded-full bg-slate-800/80 px-3 py-1 text-xs text-slate-300">
                        ${layoutOptions.find((option) => option.value === activeSlide.layout)?.label}
                      </span>
                    </div>
                    <div className="mt-6 overflow-hidden rounded-2xl border border-slate-800 bg-slate-950">
                      <div
                        className=${`flex h-64 flex-col gap-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 p-6 text-center ${
                          layoutPreviewClasses[activeSlide.layout]
                        }`}
                      >
                        ${activeSlide.imageUrl && activeSlide.layout !== "title"
                          ? html`
                              <div className="h-24 w-32 rounded-xl border border-slate-800 bg-slate-800/40">
                                <img
                                  src=${activeSlide.imageUrl}
                                  alt="Vista previa"
                                  className="h-full w-full rounded-xl object-cover"
                                />
                              </div>
                            `
                          : null}
                        <div className="max-w-md">
                          <h3 className="text-2xl font-semibold text-white">${activeSlide.title}</h3>
                          <p className="mt-2 text-sm text-slate-300">${activeSlide.content}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                <section className="flex flex-col gap-6">
                  <div className="rounded-3xl border border-slate-800/70 bg-slate-950/70 p-6 shadow-soft">
                    <h3 className="text-lg font-semibold text-slate-100">Contenido</h3>
                    <div className="mt-4 flex flex-col gap-4">
                      <label className="text-sm font-medium text-slate-300">
                        Título
                        <input
                          value=${activeSlide.title}
                          onInput=${(event) => onUpdateSlide(activeSlide.id, { title: event.target.value })}
                          className="mt-2 w-full rounded-xl border border-slate-800 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:border-indigo-400 focus:outline-none"
                          placeholder="Título de la diapositiva"
                        />
                      </label>
                      <label className="text-sm font-medium text-slate-300">
                        Contenido
                        <textarea
                          value=${activeSlide.content}
                          onInput=${(event) => onUpdateSlide(activeSlide.id, { content: event.target.value })}
                          className="mt-2 min-h-[140px] w-full rounded-xl border border-slate-800 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:border-indigo-400 focus:outline-none"
                          placeholder="Describe tu mensaje principal"
                        ></textarea>
                      </label>
                    </div>
                  </div>

                  <div className="rounded-3xl border border-slate-800/70 bg-slate-950/70 p-6 shadow-soft">
                    <h3 className="text-lg font-semibold text-slate-100">Diseño</h3>
                    <div className="mt-4 grid gap-3">
                      ${layoutOptions.map(
                        (option) => html`
                          <button
                            key=${option.value}
                            onClick=${() => onUpdateSlide(activeSlide.id, { layout: option.value })}
                            className=${`rounded-2xl border px-4 py-3 text-left transition ${
                              activeSlide.layout === option.value
                                ? "border-indigo-400/80 bg-indigo-500/10"
                                : "border-slate-800/70 bg-slate-900/50 hover:border-indigo-500/40"
                            }`}
                          >
                            <div className="text-sm font-semibold text-slate-100">${option.label}</div>
                            <div className="text-xs text-slate-400">${option.description}</div>
                          </button>
                        `
                      )}
                    </div>
                    <label className="mt-4 block text-sm font-medium text-slate-300">
                      URL de imagen
                      <input
                        value=${activeSlide.imageUrl ?? ""}
                        onInput=${(event) => onUpdateSlide(activeSlide.id, { imageUrl: event.target.value })}
                        className="mt-2 w-full rounded-xl border border-slate-800 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:border-indigo-400 focus:outline-none"
                        placeholder="https://..."
                      />
                    </label>
                  </div>

                  <div className="rounded-3xl border border-slate-800/70 bg-slate-950/70 p-6 shadow-soft">
                    <h3 className="text-lg font-semibold text-slate-100">Notas del orador</h3>
                    <textarea
                      value=${activeSlide.speakerNotes}
                      onInput=${(event) => onUpdateSlide(activeSlide.id, { speakerNotes: event.target.value })}
                      className="mt-3 min-h-[120px] w-full rounded-xl border border-slate-800 bg-slate-900/70 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:border-indigo-400 focus:outline-none"
                      placeholder="Ideas clave, tiempos y recordatorios."
                    ></textarea>
                  </div>
                </section>
              </div>
            </main>
          </div>
        `;
      };

      const App = () => {
        const [mode, setMode] = useState("editor");
        const [slides, setSlides] = useState(starterSlides);
        const [activeSlideId, setActiveSlideId] = useState(starterSlides[0]?.id ?? "");

        const activeSlideIndex = useMemo(
          () => slides.findIndex((slide) => slide.id === activeSlideId),
          [slides, activeSlideId]
        );

        const activeSlide = slides[activeSlideIndex] ?? slides[0];

        const addSlide = () => {
          setSlides((prev) => {
            const next = [...prev, createEmptySlide(prev.length + 1)];
            setActiveSlideId(next[next.length - 1].id);
            return next;
          });
        };

        const deleteSlide = (id) => {
          setSlides((prev) => {
            if (prev.length === 1) {
              return prev;
            }
            const next = prev.filter((slide) => slide.id !== id);
            if (id === activeSlideId) {
              const currentIndex = prev.findIndex((slide) => slide.id === id);
              const nextIndex = Math.max(0, currentIndex - 1);
              setActiveSlideId(next[nextIndex].id);
            }
            return next;
          });
        };

        const updateSlide = (id, updates) => {
          setSlides((prev) => prev.map((slide) => (slide.id === id ? { ...slide, ...updates } : slide)));
        };

        const goToSlide = (direction) => {
          setActiveSlideId((prevId) => {
            const index = slides.findIndex((slide) => slide.id === prevId);
            if (index === -1) {
              return slides[0]?.id ?? prevId;
            }
            const nextIndex = direction === "next" ? Math.min(slides.length - 1, index + 1) : Math.max(0, index - 1);
            return slides[nextIndex].id;
          });
        };

        return html`
          <div className="min-h-screen bg-slate-950 text-slate-100">
            ${mode === "editor"
              ? html`
                  <${Editor}
                    slides=${slides}
                    activeSlide=${activeSlide}
                    activeSlideIndex=${activeSlideIndex}
                    onAddSlide=${addSlide}
                    onDeleteSlide=${deleteSlide}
                    onSelectSlide=${setActiveSlideId}
                    onUpdateSlide=${updateSlide}
                    onPresent=${() => setMode("presenter")}
                  />
                `
              : html`
                  <${Presenter}
                    slides=${slides}
                    activeSlide=${activeSlide}
                    activeSlideIndex=${activeSlideIndex}
                    onNavigate=${goToSlide}
                    onExit=${() => setMode("editor")}
                    onSelectSlide=${setActiveSlideId}
                  />
                `}
          </div>
        `;
      };

      ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
